### FieldOps — ambiente local de desenvolvimento (docs/arquitetura.md §11.12)
###
### Sobe apenas a infraestrutura compartilhada (banco de dados e
### armazenamento de evidências compatível com S3, conforme sugerido em
### §11.8). Cada aplicação (API, mobile, interface administrativa) roda
### fora deste arquivo, no seu próprio processo/repositório, apontando para
### os serviços aqui expostos via .env (ver .env.example).
###
### Uso:
###   cp .env.example .env
###   docker compose up -d
###   docker compose --profile tools up -d   # inclui o Adminer (opcional)
###
### O schema agora é responsabilidade das migrações Flyway da API
### (api/src/main/resources/db/migration/V1..V7 — ver docs/plano-implementacao-backend.md
### §4.1), não mais deste compose: db/schema.sql passou a ser só o arquivo de
### referência histórico citado em seu próprio cabeçalho ("deve ser dividido
### em versões e removido daqui" quando as migrações existirem — já
### aconteceu). O banco sobe vazio; rode a API uma vez para aplicar as
### migrações e só então aplique o dataset de demonstração manualmente
### (db/seed.sql não fica mais montado em docker-entrypoint-initdb.d — se
### ficasse, rodaria automaticamente na primeira inicialização, antes de
### existir qualquer tabela, e quebraria o container):
###   docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < db/seed.sql

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fieldops}
      POSTGRES_USER: ${DB_USER:-fieldops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fieldops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fieldops_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fieldops} -d ${DB_NAME:-fieldops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento de evidências compatível com S3 para desenvolvimento local
  # (docs/arquitetura.md §11.8 — "poderá ser utilizado ... serviço
  # compatível com S3"). Em produção, um provedor de objetos gerenciado
  # substitui este serviço; a API só precisa apontar para outro endpoint.
  # Usa adobe/s3mock (porta interna 9090 → externa 9000) em vez de MinIO,
  # pois as imagens oficiais do MinIO requerem autenticação no registry.
  # INITIAL_BUCKETS cria o bucket fieldops-evidence automaticamente na subida.
  evidence-storage:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${EVIDENCE_STORAGE_BUCKET:-fieldops-evidence}
    ports:
      - "${EVIDENCE_STORAGE_PORT:-9000}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cliente web opcional para inspecionar o banco sem instalar nada além do
  # Docker. Não sobe por padrão — só com `--profile tools`.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fieldops_db_data:
