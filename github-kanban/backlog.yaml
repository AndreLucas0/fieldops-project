        priority: "High"
        story_points: 1
        iteration: "Sprint 2"

  - id: US-07
    title: "Gerenciar sessão de login no painel administrativo web"
    story: |
      **Como** administrador ou supervisor,
      **quero** iniciar e encerrar minha sessão na interface web,
      **para** acessar as funcionalidades administrativas com segurança.
    acceptance_criteria:
      - "Tela de login com validação e mensagem de erro sem revelar qual campo falhou"
      - "Sessão persistida e interceptador HTTP com Bearer token configurado"
      - "Logout limpa a sessão e bloqueia acesso às rotas protegidas"
      - "Refresh automático antes de redirecionar para login"
    priority: "High"
    story_points: 5
    iteration: "Sprint 2"
    tasks:
