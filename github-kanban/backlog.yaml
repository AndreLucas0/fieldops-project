# backlog.yaml — fonte de verdade do backlog.
# Rode: python sync_backlog.py --file backlog.yaml
#
# Regras:
# - IDs (US-XX, TS-XX-YY) são a chave de idempotência. Não reutilize.
# - Se você renomear um item, o título é atualizado no GitHub (mesmo ID = mesma issue).
# - Se remover um item do YAML, a issue NÃO é apagada (só logada como "órfã").

project:
  owner: "AndreLucas0"
  repo: "fieldops-project"
  project_number: 16

fields:
  status: "Status"
  type: "Type"
  priority: "Priority"
  story_points: "Story Points"
  iteration: "Iteration"

defaults:
  status: "Todo"

# ---------------------------------------------------------------
# User Stories → Tasks
# Sprint 1: Fundação técnica
# Sprint 2: Identidade, acesso e cadastros
# Sprint 3: Modelos de inspeção e planejamento
# Sprint 4: Execução de campo
# Sprint 5: Recursos nativos e evidências
# Sprint 6: Offline e sincronização
# Sprint 7: Revisão, decisão e qualidade
# Sprint 8: Entrega e demonstração
# ---------------------------------------------------------------
user_stories:

  # ── Sprint 1: Fundação técnica ──────────────────────────────

  - id: US-01
    title: "Configurar repositório e convenções de desenvolvimento"
    story: |
      **Como** equipe de desenvolvimento,
      **quero** repositórios criados com convenções definidas,
      **para** desenvolver os componentes de forma coordenada e padronizada.
    acceptance_criteria:
      - "Repositório criado com estrutura de pastas definida e README inicial"
      - "Lint, verificação de tipos e hooks de qualidade configurados"
      - "Fluxo de pull request documentado e template criado"
      - "Contrato inicial de autenticação e enums definidos"
    priority: "High"
    story_points: 5
    iteration: "Sprint 1"
    tasks:
      - id: TS-01-01
        title: "Criar repositório no GitHub com estrutura de pastas base"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-02
        title: "Adicionar .gitignore, .editorconfig e README inicial"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-03
        title: "Configurar ESLint e Prettier com regras base"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-04
        title: "Configurar TypeScript com strict mode nos projetos"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-05
        title: "Configurar pre-commit hooks com Husky e lint-staged"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-06
        title: "Criar template de pull request e regras de proteção de branch"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-01-07
        title: "Documentar convenções de commit e fluxo Git no README"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"

  - id: US-02
    title: "Criar projeto base do aplicativo mobile (Expo + TypeScript)"
    story: |
      **Como** desenvolvedor mobile,
      **quero** um projeto Expo com TypeScript, rotas e estrutura por features,
      **para** iniciar o desenvolvimento do aplicativo de forma organizada.
    acceptance_criteria:
      - "Projeto Expo inicializado com TypeScript e Expo Router configurado"
      - "Estrutura de pastas por features criada com aliases de importação"
      - "Rotas públicas e protegidas funcionando com dados mockados"
      - "Componentes base criados: botão, campo de texto, card e estado de tela"
    priority: "High"
    story_points: 8
    iteration: "Sprint 1"
    tasks:
      - id: TS-02-01
        title: "Inicializar projeto Expo com SDK atual e TypeScript"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-02-02
        title: "Instalar e configurar Expo Router com grupos de rotas (público e protegido)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-02-03
        title: "Configurar aliases de importação via tsconfig paths"
        priority: "High"
        story_points: 1
        iteration: "Sprint 1"
      - id: TS-02-04
