      **para** registrar a decisão com rastreabilidade e proteger os dados.
    acceptance_criteria:
      - "Aprovação registra revisor, horário e comentário opcional"
      - "Estado muda para Aprovada e respostas ficam protegidas"
      - "Ação auditada com data, hora e usuário"
      - "Aprovação disponível somente para inspeções em revisão"
    priority: "High"
    story_points: 5
    iteration: "Sprint 7"
    tasks:
      - id: TS-28-01
        title: "Implementar endpoint POST /inspections/:id/approve na API"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-28-02
        title: "Registrar revisor, horário e comentário na aprovação com entrada na tabela de auditoria"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-28-03
        title: "Bloquear endpoints de edição de respostas quando inspeção estiver aprovada"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-28-04
        title: "Implementar botão de aprovação com modal de confirmação e campo de comentário (web)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-28-05
        title: "Atualizar estado da inspeção para Aprovada na listagem após ação (web)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"

  - id: US-29
    title: "Reprovar inspeção com motivo obrigatório"
    story: |
      **Como** supervisor,
      **quero** reprovar uma inspeção informando o motivo,
      **para** que o técnico receba as instruções de correção na próxima sincronização.
    acceptance_criteria:
      - "Reprovação sem motivo bloqueada pela API"
      - "Estado muda para Reprovada com registro de revisor, horário e motivo"
