        story_points: 1
        iteration: "Sprint 7"
      - id: TS-29-03
        title: "Implementar formulário de reprovação com campo de motivo obrigatório no painel web"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-29-04
