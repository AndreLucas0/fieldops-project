        title: "Criar tabela audit_log com campos: evento, entidade_id, usuario_id, estado_anterior, estado_novo, timestamp"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-30-02
        title: "Registrar auditoria em: início, conclusão, início de revisão, aprovação, reprovação e cancelamento"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-30-03
        title: "Implementar endpoint GET /inspections/:id/history e exibir histórico na tela de revisão (web)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"

