    title: "Autenticar usuário com e-mail e senha via API"
    story: |
      **Como** usuário do sistema,
      **quero** autenticar-me com e-mail e senha,
      **para** acessar somente os recursos permitidos ao meu perfil.
    acceptance_criteria:
      - "Login válido retorna access token JWT e refresh token com expiração definida"
      - "Credenciais inválidas retornam erro sem revelar qual campo está incorreto"
      - "Usuário inativo tem acesso negado com mensagem orientativa"
      - "Token de acesso renovado automaticamente via refresh token"
    priority: "High"
    story_points: 8
    iteration: "Sprint 2"
    tasks:
