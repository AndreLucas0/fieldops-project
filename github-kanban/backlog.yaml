        story_points: 1
        iteration: "Sprint 6"
      - id: TS-24-04
        title: "Implementar envio de lote de operações ao servidor"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-24-05
        title: "Processar resultado individual por operação e marcar confirmadas no SQLite"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-24-06
        title: "Implementar retry controlado para operações com falha recuperável"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-24-07
        title: "Implementar idempotência na API: rejeitar ou responder operação já processada pelo mesmo idempotency_key"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"

  - id: US-25
    title: "Baixar alterações do servidor com cursor de sincronização incremental"
    story: |
      **Como** sistema,
      **quero** baixar apenas as alterações ocorridas desde a última sincronização,
      **para** manter o estado local atualizado com eficiência e sem redundância.
    acceptance_criteria:
      - "Cursor avança somente após persistência local confirmada"
      - "Alterações do servidor atualizam estados das inspeções locais"
      - "Conflito de versão detectado e dados locais preservados"
      - "Inspeção cancelada atualiza estado local sem apagar respostas pendentes"
    priority: "High"
    story_points: 8
    iteration: "Sprint 6"
    tasks:
      - id: TS-25-01
        title: "Implementar endpoint GET /sync/pull?after=cursor na API retornando eventos desde o cursor"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-25-02
        title: "Implementar geração de cursor baseado em timestamp ou sequência incremental"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-25-03
        title: "Implementar cliente de pull no mobile consumindo o endpoint com cursor persistido localmente"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-25-04
        title: "Avançar cursor local somente após persistência dos dados recebidos no SQLite"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-25-05
        title: "Detectar conflito de versão e marcar inspeção com estado de conflito sem sobrescrever local"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-25-06
        title: "Atualizar estado local de inspeção cancelada sem apagar respostas pendentes"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"

  - id: US-26
    title: "Monitorar status de sincronização no aplicativo"
    story: |
      **Como** técnico,
      **quero** visualizar o status de sincronização e as pendências no aplicativo,
      **para** saber se os dados foram enviados com sucesso ou se há falhas.
    acceptance_criteria:
      - "Tela exibe operações pendentes, falhas e data da última sincronização"
      - "Outbox persiste ao sair e entrar no app"
      - "Falha de envio exibe mensagem com opção de tentar novamente"
      - "Contador de pendências atualizado após cada sincronização"
    priority: "High"
    story_points: 3
    iteration: "Sprint 6"
    tasks:
      - id: TS-26-01
        title: "Criar tela de sincronização com contador de operações pendentes por tipo"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-26-02
        title: "Exibir data e hora da última sincronização bem-sucedida"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"
      - id: TS-26-03
        title: "Exibir mensagem de erro por operação com falha e botão de sincronização manual"
        priority: "High"
        story_points: 1
        iteration: "Sprint 6"

  # ── Sprint 7: Revisão, decisão e qualidade ───────────────────

  - id: US-27
    title: "Revisar inspeção enviada por seção e item"
    story: |
      **Como** supervisor,
      **quero** revisar o conteúdo de uma inspeção navegando por seções e itens,
      **para** analisar respostas, observações e evidências antes de decidir.
    acceptance_criteria:
      - "Listagem de inspeções enviadas com filtros por técnico, cliente, estado e período"
      - "Revisão navega pelas seções com respostas, observações e evidências"
      - "Início formal da revisão muda estado para Em revisão com auditoria"
      - "Visualização respeita o perfil do usuário"
    priority: "High"
    story_points: 8
    iteration: "Sprint 7"
    tasks:
      - id: TS-27-01
        title: "Implementar endpoint GET /inspections?status=submitted com filtros avançados (API)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-27-02
        title: "Criar tela de listagem de inspeções enviadas com filtros no painel web"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-27-03
        title: "Criar tela de revisão com navegação entre seções do checklist (web)"
        priority: "High"
        story_points: 1
        iteration: "Sprint 7"
      - id: TS-27-04
        title: "Exibir resposta, tipo, observação e evidências por item na tela de revisão (web)"
        priority: "High"
