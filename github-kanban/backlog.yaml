  - id: US-30
    title: "Registrar e consultar histórico de mudanças de estado"
    story: |
      **Como** responsável por auditoria,
      **quero** ter todas as transições de estado registradas e consultáveis,
      **para** garantir rastreabilidade completa do ciclo de vida das inspeções.
    acceptance_criteria:
      - "Transições críticas registradas com data, hora, usuário e estado anterior"
      - "Histórico mínimo consultável na revisão administrativa"
      - "Senhas, tokens e stack traces não expostos em logs ou respostas"
      - "Segredos não versionados no repositório"
    priority: "High"
    story_points: 3
    iteration: "Sprint 7"
    tasks:
