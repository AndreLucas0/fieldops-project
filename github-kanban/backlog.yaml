      - "Versão publicada é numerada e imutável; alterações geram nova versão"
      - "Inspeções existentes preservam o snapshot da versão utilizada"
      - "Prévia do checklist exibida antes da publicação"
    priority: "High"
    story_points: 8
    iteration: "Sprint 3"
    tasks:
