        priority: "High"
        story_points: 1
        iteration: "Sprint 2"
      - id: TS-05-09
        title: "Implementar endpoint POST /auth/logout com invalidação de token"
        priority: "High"
        story_points: 1
        iteration: "Sprint 2"

  - id: US-06
    title: "Gerenciar sessão de login no aplicativo mobile"
    story: |
      **Como** técnico,
      **quero** iniciar e encerrar minha sessão no aplicativo,
      **para** acessar minhas inspeções com segurança.
    acceptance_criteria:
      - "Tela de login com validação de campos e mensagem de erro sem revelar detalhes"
      - "Sessão persistida com SecureStore e carregada ao reiniciar o app"
      - "Logout remove dados sensíveis e retorna à tela de login"
      - "Refresh automático de token transparente ao usuário"
    priority: "High"
    story_points: 8
    iteration: "Sprint 2"
    tasks:
